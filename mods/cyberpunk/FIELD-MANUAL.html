"key": "cyberpunk-siege", "file": "sfx/cyberpunk-siege.mp3"}, {"key": "cyberpunk-torpedo", "file": "sfx/cyberpunk-torpedo.mp3"}, {"key": "cyberpunk-overclock", "file": "sfx/cyberpunk-overclock.mp3"}, {"key": "cyberpunk-rupture", "file": "sfx/cyberpunk-rupture.mp3"}], "maps": ["maps/01-gridfall.steel-tide-map", "maps/02-glass-causeway.steel-tide-map", "maps/03-ghost-market.steel-tide-map", "maps/04-undertow.steel-tide-map", "maps/05-cinder-circuit.steel-tide-map", "maps/06-cloudbreak.steel-tide-map", "maps/07-split-signal.steel-tide-map", "maps/08-blackout.steel-tide-map"], "screenshots": ["covers/blackout-card.webp", "screenshots/01-gridfall.jpg", "screenshots/02-prism-front.jpg", "screenshots/03-undertow.jpg", "screenshots/04-blackout.jpg"]}, "operations": {"premise": ["Veyra was built around a privately owned power grid. When the exchanges sealed their districts, the city split into islands of light. A coalition of dock crews, machine tenders and disconnected neighbourhoods has seized an abandoned Nexus. The Blackout Protocol is their plan to take the exchanges apart, district by district, and reopen the city.", "维拉城围绕一张私营电网建成。交换站封锁各自辖区后，城市裂成了彼此隔绝的光岛。码头工人、机务员与断网街区组成的联盟夺下了一座废弃枢纽。“断电协议”是他们逐区瓦解交换站、重新打通城市的计划。", "베이라는 민간 전력망을 중심으로 세워졌다. 교환소들이 구역을 봉쇄하자 도시는 빛의 섬들로 갈라졌다. 부두 노동자, 기계 정비사와 단절된 구역의 연합은 버려진 넥서스를 점령했다. 블랙아웃 프로토콜은 교환소를 하나씩 무너뜨리고 도시를 다시 연결하려는 계획이다."], "operations": [{"id": "01-gridfall", "seats": 2, "minutes": "35–55", "focus": ["Economy & raiding", "经济与袭扰", "경제와 습격"], "brief": ["The exchange quarter has gone dark. Your workshops still run, but the opposing district already has a working signal network. The central switching yards are the quickest source of metal and the first place both sides will meet.", "交换中心区已陷入黑暗。你的工坊仍在运转，对面城区却已拥有完整信号网。中央编组场既是最近的矿源，也是双方最先交锋之处。", "교환소 지구의 불이 꺼졌다. 우리 작업장은 가동 중이지만 상대 구역은 이미 신호망을 갖췄다. 중앙 조차장은 가까운 자원이자 양측이 처음 맞부딪힐 곳이다."], "plan": ["Expand into the middle, field Needles against light raiders, and use Mantis Redline only while you can disengage. Build the Spire before committing to shield armor. A Suture lets a damaged force withdraw and return.", "向中央扩张，用针锋机应对轻型袭扰。保证退路后再启用螳螂的越限。投入护盾装甲前先建尖塔，利用缝合车让受损部队撤回整修。", "중앙으로 확장하고 니들로 경량 습격대를 막는다. 퇴로를 확보한 뒤 맨티스의 레드라인을 쓴다. 방벽 전력을 투입하기 전에 첨탑을 세우고 수처로 후퇴한 병력을 정비한다."], "challenges": [["Take two central deposits before destroying an enemy production building.", "摧毁敌方生产建筑前，先占用两处中央矿点。", "적 생산 건물을 파괴하기 전에 중앙 광맥 두 곳을 확보한다."], ["Win without constructing an Oracle Core.", "不建造先知核心取得胜利。", "오라클 코어를 건설하지 않고 승리한다."], ["Win on Seasoned using only Cyberpunk combat production.", "在老练难度获胜，战斗单位仅生产赛博朋克部队。", "숙련에서 사이버펑크 전투 병력만 생산해 승리한다."]], "names": ["01 · Gridfall", "01 · 电网坠落", "01 · 그리드폴"]}, {"id": "02-glass-causeway", "seats": 2, "minutes": "40–65", "focus": ["Shield rotation & flanking", "护盾轮换与侧击", "방벽 교대와 우회"], "brief": ["The reservoir gates have been welded shut. Three causeways lead to the eastern factories. Their nearest quay is fortified, but every crossing leads to a different flank.", "水库闸门已被焊死。三条堤道通往东岸工厂。最近的码头筑有工事，但每条通路都能抵达不同侧翼。", "저수지 수문이 용접되어 닫혔다. 세 둑길이 동쪽 공장으로 이어진다. 가까운 부두는 요새화됐지만 각 통로는 서로 다른 측면으로 통한다."], "plan": ["Place Aegis tanks ahead of Lancers. Lock Shields buys time at the crossing, then pull battered tanks behind the firing line to recharge. Relays belong close enough to help the Lancers but far enough back to survive. A second crossing can carry the decisive raid.", "神盾坦克在前，枪骑兵在后。用锁定护盾顶住堤口，再将受损坦克撤到火线后充能。中继车既要覆盖枪骑兵，也要避开集火。另一条堤道可用于决定性的突袭。", "이지스를 랜서 앞에 세운다. 방벽 고정으로 둑길에서 시간을 번 뒤 피해를 입은 전차를 뒤로 빼 충전한다. 중계차는 랜서를 지원하되 집중 사격을 피할 거리에 둔다. 다른 둑길로 결정적인 습격을 보낼 수 있다."], "challenges": [["Cross and fight on all three causeways before winning.", "取胜前在三条堤道均完成渡越和交战。", "승리 전에 세 둑길을 모두 건너 교전한다."], ["Win without losing either starting Aegis tank.", "保住两辆初始神盾坦克并取胜。", "시작 이지스 전차 두 대를 모두 지키고 승리한다."], ["Win on Seasoned without building artillery or Archons.", "老练难度，不建造爬行炮或执政官并取胜。", "숙련에서 크롤러와 아르콘을 생산하지 않고 승리한다."]], "names": ["02 · Glass Causeway", "02 · 玻璃堤道", "02 · 유리 둑길"]}, {"id": "03-ghost-market", "seats": 2, "minutes": "40–65", "focus": ["Stealth & counter-reconnaissance", "隐匿与反侦察", "은폐와 역정찰"], "brief": ["Behind the shuttered market, service alleys lead past the checkpoints. The exchange pays its sentries well; its tenders and relays are less secure. Your infiltration force begins with a dropship and two Wraiths.", "闭市商铺后的小巷绕过了检查站。交换站重金养着守卫，支援与中继车辆却暴露在外。你的渗透部队拥有一艘空投艇和两台幽影。", "닫힌 시장 뒤 골목은 검문소를 우회한다. 교환소의 경비는 강하지만 지원차와 중계차는 노출되어 있다. 침투대는 강하정과 레이스 두 기로 시작한다."], "plan": ["Scout detector positions before committing Wraiths. A Wraith excels inside a Lancer's minimum range, but loses quickly to concentrated Needles. Use the ring road to distract the main force while a small group raids a different entrance.", "投入幽影前侦察探测器位置。幽影适合钻入枪骑兵的近距盲区，但集中部署的针锋机会迅速将其击毁。利用环路牵制主力，让小队从另一入口袭击。", "레이스를 투입하기 전에 탐지기의 위치를 정찰한다. 레이스는 랜서의 최소 사거리 안에서 강하지만 밀집한 니들에는 약하다. 순환도로에서 주력을 유인하는 동안 소규모 부대를 다른 입구로 보낸다."], "challenges": [["Destroy a Conductor or Spire with Wraiths before your first frontal base attack.", "首次正面攻基地前，用幽影摧毁一辆中继车或一座尖塔。", "첫 정면 기지 공격 전에 레이스로 중계차나 첨탑을 파괴한다."], ["Win without losing either starting Wraith.", "保住两台初始幽影并取胜。", "시작 레이스 두 기를 모두 지키고 승리한다."], ["Win on Seasoned without producing Aegis, Strider or Archon units.", "老练难度，不生产神盾、跨行者或执政官并取胜。", "숙련에서 이지스, 스트라이더, 아르콘을 생산하지 않고 승리한다."]], "names": ["03 · Ghost Market", "03 · 幽灵集市", "03 · 유령 시장"]}, {"id": "04-undertow", "seats": 2, "minutes": "45–75", "focus": ["Sonar, carrier sorties & landings", "声呐、舰载机与登陆", "소나, 함재기와 상륙"], "brief": ["The shipping channel is the city's remaining supply artery. A sand island divides the deep lanes. The eastern fleet brings a rail cruiser and a drone tender; your submarines can contest the depths, but the shore still has to be taken.", "航道是城市最后的补给动脉。沙岛将深水航线一分为二。东岸舰队拥有轨道巡洋舰和无人机母舰，你的潜艇可争夺深水，但仍须夺取海岸。", "항로는 도시의 마지막 보급 동맥이다. 모래섬이 깊은 수로를 가른다. 동쪽 함대에는 레일 순양함과 드론 모함이 있다. 잠수함으로 심해를 다툴 수 있지만 해안도 점령해야 한다."], "plan": ["Prism Skiffs screen submerged hunters with sonar and close torpedoes. Undertows threaten unscreened carriers and cruisers. The Ferryman's wing attacks surface targets; it cannot solve a submarine attack. Land a Fabricator on the island to support an airlift across the channel.", "棱镜快艇以声呐和近距鱼雷掩护舰队。潜流猎手克制缺少护航的母舰与巡洋舰。摆渡人的机群攻击水面目标，无法解决潜艇威胁。让工程机登上沙岛，支援跨越航道的空运。", "프리즘 스키프가 소나와 근거리 어뢰로 잠수함을 막는다. 언더토는 호위가 없는 모함과 순양함을 위협한다. 페리맨의 편대는 수상 표적을 공격하며 잠수함을 상대할 수 없다. 섬에 제작기를 상륙시켜 항로를 넘는 공수를 지원한다."], "challenges": [["Establish a Substrate Tap and a Prism Bastion on the central island.", "在中央岛屿建成基底采掘站与棱镜堡垒。", "중앙 섬에 기층 채굴기와 프리즘 보루를 완공한다."], ["Win while preserving your starting Ferryman.", "保住初始摆渡人母舰并取胜。", "시작 페리맨 모함을 지키고 승리한다."], ["Win on Seasoned without producing Leviathans or vanilla warships.", "老练难度，不生产利维坦或原版战舰并取胜。", "숙련에서 레비아탄과 기본 게임 전함을 생산하지 않고 승리한다."]], "names": ["04 · Undertow", "04 · 潜流", "04 · 언더토"]}, {"id": "05-cinder-circuit", "seats": 2, "minutes": "45–75", "focus": ["Siege timing & fire discipline", "攻城节奏与火力纪律", "공성 시점과 사격 통제"], "brief": ["The furnace quarter feeds the exchange's armored reserve. Basalt walls hide gun positions, and the southern works have a walking siege engine. A direct advance meets overlapping artillery; the ash roads offer another approach.", "熔炉区供养着交换站的装甲预备队。玄武岩墙遮蔽炮位，南部厂区还驻有步行攻城引擎。直进将撞上交叉炮火，灰烬中的厂道提供了另一条进路。", "용광로 지구는 교환소의 기갑 예비대를 공급한다. 현무암 벽이 포대를 숨기고 남쪽 공장에는 보행 공성기관이 있다. 정면 진격은 겹친 포격을 받지만 잿길로 우회할 수 있다."], "plan": ["Observe with a Kite or Runner, deploy Breach Crawlers behind the screen, and move friendly armor clear of their impact zone. Pack before changing front. Reactor ruptures punish dense construction on either side, making raiding as valuable as bombardment.", "用鸢式无人机或疾行者观察，将爬行炮展开在屏障后方，让己方装甲避开落点。转移战线前先收炮。反应堆破裂会惩罚密集建筑，因此突袭与炮击同样重要。", "카이트나 러너로 관측하고 방벽 뒤에 크롤러를 전개한다. 아군 기갑은 탄착 지역에서 빼낸다. 전선을 바꾸기 전에 포를 수납한다. 반응로 붕괴는 양측의 밀집 건설을 벌하므로 습격도 포격만큼 중요하다."], "challenges": [["Win while keeping both starting Breach Crawlers alive.", "保住两台初始爬行炮并取胜。", "시작 크롤러 두 기를 모두 지키고 승리한다."], ["Destroy an enemy reactor with a raiding force before your first Archon is produced.", "首台执政官造出前，用突袭队摧毁敌方反应堆。", "첫 아르콘을 생산하기 전에 습격대로 적 반응로를 파괴한다."], ["Win on Seasoned without producing aircraft.", "老练难度，不生产飞行单位并取胜。", "숙련에서 항공기를 생산하지 않고 승리한다."]], "names": ["05 · Cinder Circuit", "05 · 烬火回路", "05 · 잿불 회로"]}, {"id": "06-cloudbreak", "seats": 2, "minutes": "40–65", "focus": ["Airlift & air superiority", "空运与制空", "공수와 제공권"], "brief": ["Frozen ridgelines divide the northern service corridor. The ground route is long, but the clearings between the walls can hold a forward workshop. Your two dropships can put a raiding group behind the next ridge.", "冰封山脊分割北部后勤走廊。陆路漫长，山墙之间的空地却可容纳前进工坊。两艘空投艇能将突袭队送到下一道山脊后方。", "얼어붙은 능선이 북쪽 작업 통로를 나눈다. 육로는 길지만 산벽 사이 공터에는 전진 작업장을 세울 수 있다. 강하정 두 척으로 다음 능선 뒤에 습격대를 투입할 수 있다."], "plan": ["Send Razors ahead of loaded Harriers. Their shields buy a short margin under fire. Airlift ground escorts over the ridge while Fabricators take the land or water route to establish a forward Nexus. Amphibious Fabricators and Runners cannot ride in this ground-unit hold. Keep a retreat route for damaged aircraft.", "先让剃刀为载人的猎鹞开路，护盾只能在火力下争取短暂余地。空运地面护卫翻越山脊，同时让制造者沿陆路或水路抵达并建立前进枢纽。两栖工程机和疾行者无法进入这种地面单位货舱。为受损飞行器保留撤退路线。", "병력을 실은 해리어 앞에 레이저를 보낸다. 방벽은 포화 속에서 짧은 여유만 준다. 지상 호위를 능선 너머로 공수하는 동안 패브리케이터는 육로나 수로로 이동해 전진 넥서스를 세운다. 수륙양용 제작기와 러너는 이 지상 유닛 화물칸에 탑승할 수 없다. 손상된 항공기의 퇴로를 확보한다."], "challenges": [["Land ground units in the central clearing and hold a deposit there.", "让地面部队降落中央空地并占用一处矿点。", "중앙 공터에 지상 병력을 내려 광맥 한 곳을 확보한다."], ["Win while keeping both starting Harriers alive.", "保住两艘初始猎鹞空投艇并取胜。", "시작 해리어 두 척을 모두 지키고 승리한다."], ["Win on Seasoned without producing Vespers, Breach Crawlers or Archons.", "老练难度，不生产暮星、爬行炮或执政官并取胜。", "숙련에서 베스퍼, 크롤러, 아르콘을 생산하지 않고 승리한다."]], "names": ["06 · Cloudbreak", "06 · 破云", "06 · 구름 돌파"]}, {"id": "07-split-signal", "seats": 4, "minutes": "50–80", "focus": ["Allied networks & two-front war", "盟军网络与双线作战", "동맹 네트워크와 양면전"], "brief": ["Two western districts have joined the coalition. The port now divides a city fighting on two fronts. A shared relay network can keep both armies moving, but concentrating everything on one avenue leaves the other district exposed.", "西部两区已加入联盟。港口如今将双线交战的城市分开。共享中继网能支撑两支军队，但将全部兵力挤在一条大道上，会暴露另一城区。", "서쪽 두 구역이 연합에 합류했다. 항만을 사이에 두고 두 전선이 열렸다. 공유 중계망은 두 군대를 지원하지만 한 대로에 전력을 모으면 다른 구역이 노출된다."], "plan": ["Set seats 1 and 2 to the same team, against seats 3 and 4. Friendly relays and Suture support include allies. Keep a reserve between the two western fronts and use the port crossings to change where your opponent must defend.", "将1、2号席位设为同队，对抗3、4号。友方中继和缝合支援包含盟军。在西部两线之间保留预备队，利用港口通路改变敌方必须防守的位置。", "1·2번 좌석을 같은 팀으로, 3·4번을 적 팀으로 설정한다. 우호 중계와 수처 지원은 동맹에도 적용된다. 서쪽 두 전선 사이에 예비대를 두고 항만 통로로 적의 방어 지점을 바꾼다."], "challenges": [["Win with both allied headquarters still standing.", "两座盟军总部均存活时取得胜利。", "동맹 본부 두 곳이 모두 남은 상태로 승리한다."], ["Fight alongside your ally with a Conductor and a Suture from your own army.", "用自己的中继车和缝合车随盟军协同作战。", "자신의 중계차와 수처를 동맹군과 함께 전투에 투입한다."], ["Win with both enemies on Seasoned; do not produce Archons.", "两名敌人均设老练，不生产执政官并取胜。", "두 적을 숙련으로 설정하고 아르콘을 생산하지 않고 승리한다."]], "names": ["07 · Split Signal", "07 · 分裂信号", "07 · 분열 신호"]}, {"id": "08-blackout", "seats": 4, "minutes": "60–90", "focus": ["Combined arms & layered defenses", "合成部队与纵深防御", "제병협동과 종심 방어"], "brief": ["The central exchange has closed its perimeter. Prism guns, deployed drivers and a heavy reserve protect the eastern districts. The reservoir divides the approaches; the outer streets run behind parts of the line. This is the coalition's final offensive.", "中央交换站封闭了外围。棱镜炮、展开的投射器和重型预备队保护着东部城区。水库分割进路，外环街道却可绕至部分防线之后。这是联盟的最后攻势。", "중앙 교환소가 외곽을 봉쇄했다. 프리즘 포와 전개된 투사포, 중장 예비대가 동쪽 구역을 지킨다. 저수지가 진입로를 나누지만 외곽 도로는 일부 방어선 뒤로 이어진다. 연합의 마지막 공세다."], "plan": ["Use the same 1+2 versus 3+4 teams. Scout before moving siege weapons into overlapping fields of fire. Raids remove relays and reactors while shielded formations pin the defenders. Split your support assets so one bombardment cannot break the whole army.", "继续采用1+2对3+4。攻城武器进入交叉火力区前务必侦察。用护盾阵线牵制守军，同时突袭中继和反应堆。分散支援车辆，避免一次炮击摧毁整军支撑。", "1+2 대 3+4 팀 구성을 유지한다. 공성 무기를 겹친 화망에 넣기 전에 정찰한다. 방벽 진형으로 수비대를 묶고 중계차와 반응로를 습격한다. 한 번의 포격으로 지원망 전체가 무너지지 않도록 분산한다."], "challenges": [["Destroy both enemy Oracle Cores before the final enemy headquarters falls.", "最后一座敌方总部倒下前，先摧毁两座敌方先知核心。", "마지막 적 본부가 무너지기 전에 적 오라클 코어 두 곳을 파괴한다."], ["Win while preserving your starting Conductor and Suture.", "保住自己的初始中继车与缝合车并取胜。", "자신의 시작 중계차와 수처를 지키고 승리한다."], ["Win with both enemies on Seasoned and without producing an Archon.", "两名敌人均设老练，不生产执政官并取胜。", "두 적을 숙련으로 설정하고 아르콘을 생산하지 않고 승리한다."]], "names": ["08 · Blackout", "08 · 断电", "08 · 블랙아웃"]}]}, "layouts": [{"file": "01-gridfall", "name": "01 · Gridfall", "w": 112, "h": 88, "seats": 2, "pieces": 30, "landAccess": [{"landTiles": 9060, "reachableOre": 10}, {"landTiles": 9060, "reachableOre": 10}], "notes": "Introductory asymmetric opening: basic raiding force against a better equipped corporate yard. Ground routes north and south; central expansion."}, {"file": "02-glass-causeway", "name": "02 · Glass Causeway", "w": 144, "h": 104, "seats": 2, "pieces": 37, "landAccess": [{"landTiles": 11708, "reachableOre": 10}, {"landTiles": 11708, "reachableOre": 10}], "notes": "Three crossing widths punish clumping and reward lateral movement; no naval starts on isolated reservoir sections."}, {"file": "03-ghost-market", "name": "03 · Ghost Market", "w": 136, "h": 104, "seats": 2, "pieces": 37, "landAccess": [{"landTiles": 12109, "reachableOre": 11}, {"landTiles": 12109, "reachableOre": 11}], "notes": "Stealth and detection, back-lane raids, drops over city blocks. The ring road always allows a direct land assault."}, {"file": "04-undertow", "name": "04 · Undertow", "w": 152, "h": 120, "seats": 2, "pieces": 51, "landAccess": [{"landTiles": 5280, "reachableOre": 4}, {"landTiles": 5280, "reachableOre": 4}], "notes": "A naval battle with air and amphibious expansion. Carrier drones cannot see submerged hunters; sonars are essential."}, {"file": "05-cinder-circuit", "name": "05 · Cinder Circuit", "w": 160, "h": 120, "seats": 2, "pieces": 43, "landAccess": [{"landTiles": 17124, "reachableOre": 11}, {"landTiles": 17124, "reachableOre": 11}], "notes": "Artillery and friendly fire, long-range observation, reactor spacing; two broad approaches prevent a single turret lock."}, {"file": "06-cloudbreak", "name": "06 · Cloudbreak", "w": 144, "h": 128, "seats": 2, "pieces": 42, "landAccess": [{"landTiles": 16164, "reachableOre": 11}, {"landTiles": 16164, "reachableOre": 11}], "notes": "Aircraft and cargo create short routes across the ridges. All bases remain reachable by ground around the mountain ends."}, {"file": "07-split-signal", "name": "07 · Split Signal", "w": 176, "h": 136, "seats": 4, "pieces": 80, "landAccess": [{"landTiles": 21856, "reachableOre": 18}, {"landTiles": 21856, "reachableOre": 18}, {"landTiles": 21856, "reachableOre": 18}, {"landTiles": 21856, "reachableOre": 18}], "notes": "Designed for seats 1+2 versus 3+4, also supports free-for-all. Allies can share relay and repair support."}, {"file": "08-blackout", "name": "08 · Blackout", "w": 208, "h": 152, "seats": 4, "pieces": 101, "landAccess": [{"landTiles": 28202, "reachableOre": 20}, {"landTiles": 28202, "reachableOre": 20}, {"landTiles": 28202, "reachableOre": 20}, {"landTiles": 28202, "reachableOre": 20}], "notes": "Final 2v2 offensive, seats 1+2 against 3+4. Outer districts can be bypassed; raids on reactors and relay vehicles weaken a frontal defence."}]};
const words={hero:['Reclaim a city of light. Build the network. Break the perimeter.','夺回光之城，建立网络，突破封锁。','빛의 도시를 되찾고, 네트워크를 구축하고, 봉쇄선을 돌파하라.'],build:['Buildings','建筑','건물'],unit:['Recruitable units','可生产单位','생산 유닛'],map:['Battlefields','战场','전장'],goals:['Mastery challenges','精通挑战','숙련 도전'],start:['Deployment','部署','배치'],doctrine:['Field tactics','战地战术','전장 전술'],roster:['The arsenal','军械库','전력 목록'],operations:['Operation atlas','作战地图集','작전 지도집'],installTitle:['Ready for deployment','准备部署','배치 준비'],install:['Settings → Mods → Upload file… → cyberpunk-1.2.1.zip. Enable the mod, choose Blackout Protocol for every seat in the operation atlas, and start 01 · Gridfall. On regular maps, choose Steel Tide for your opponent to play a faction duel. No extraction is needed for installation.','设置 → 模组 → 上传文件… → cyberpunk-1.2.1.zip。开启模组，地图集各席位选择断电协议阵营，从01 · 电网坠落开始。普通地图可为对手选择Steel Tide，进行阵营对战。安装无需解压。','설정 → 모드 → 파일 업로드… → cyberpunk-1.2.1.zip. 모드를 활성화하고 지도집의 모든 자리를 블랙아웃 프로토콜로 설정한 뒤 01 · 그리드폴을 선택한다. 일반 지도에서는 상대를 Steel Tide로 설정해 진영 대전을 한다. 설치할 때 압축을 풀 필요는 없다.'],preset:['Atlas preset: Standard · fog on · 1,600 metal · 150 population · 6 production slots/HQ · Build radius off. Maps 07–08: seats 1+2 versus 3+4.','地图集预设：标准难度、迷雾开启、金属1600、人口150、每总部6个生产槽、关闭建造范围。07–08：1+2对3+4。','지도집 설정: 표준 · 안개 켜기 · 금속 1,600 · 인구 150 · 본부당 생산 슬롯 6 · 건설 범위 끄기. 07–08: 1+2 대 3+4.'],networkTitle:['A screen that can recover','可以轮换恢复的阵线','회복하며 교대하는 전열'],network:['Aegis tanks take the first contact; Lancers fire from behind. A Conductor gives linked shooters a 16% shorter reload interval within six tiles. A Suture heals nearby Cyberpunk units after four seconds without firing. Shield recharge instead requires time without taking damage. Multiple support vehicles do not stack the same pulse.','神盾承受初次接触，枪骑兵在后方射击。中继车使六格内的联网射手装填间隔缩短16%。缝合车治疗停火四秒的附近赛博朋克单位。护盾充能则要求持续不受伤。相同支援脉冲不会因车辆增加而叠加。','이지스가 먼저 접촉하고 랜서가 뒤에서 사격한다. 중계차는 6칸 내 연결 사수의 재장전 간격을 16% 줄인다. 수처는 4초간 사격하지 않은 주변 사이버펑크 유닛을 회복한다. 방벽 충전은 피해를 받지 않는 시간이 필요하다. 동일 지원 펄스는 중첩되지 않는다.'],counterTitle:['Threats have different answers','每种威胁有不同解法','위협마다 다른 대응'],counter:['Needles break light raiders; Wraiths exploit exposed specialists. Artillery fires over a screen but can hit your own troops. Skiffs screen submarines, submarines hunt capital ships, and the rail cruiser breaks surface swarms. Razors defend the sky; neither a laser tank nor a carrier replaces them.','针锋打击轻型袭扰，幽影猎杀暴露的专业单位。炮兵越过前排射击，但可能误伤己方。快艇反潜、潜艇猎杀主力舰、轨道巡洋舰打散水面集群。截击机负责制空，激光坦克和母舰都不能代替它。','니들은 경량 습격대를 막고 레이스는 노출된 전문 유닛을 노린다. 포병은 전열 뒤에서 사격하지만 아군을 맞힐 수 있다. 스키프는 잠수함을, 잠수함은 주력함을, 레일 순양함은 수상 집단을 상대한다. 제공권은 요격기가 맡는다.'],all:['All','全部','전체'],ground:['Ground','地面','지상'],air:['Air','空中','공중'],ship:['Naval','海军','해군'],search:['Search the roster','搜索单位或建筑','전력 검색'],opNote:['These maps use normal skirmish victory rules. The 24 extra challenges below are self-tracked; checks are saved in this browser. Times are design estimates. A first tour plus a restricted Seasoned replay targets 10+ hours, depending on your pace and retries.','这些地图遵循普通遭遇战胜利规则。下列24项额外挑战由玩家自行记录，勾选保存在本浏览器。时间为设计估计；首轮加上限制生产的老练难度重玩，目标为10小时以上，实际取决于节奏与重试。','지도는 일반 대전 승리 규칙을 사용한다. 아래 추가 도전 24개는 직접 기록하며 체크는 이 브라우저에 저장된다. 시간은 설계 추정치다. 첫 순회와 생산 제한 숙련 난이도 재도전으로 10시간 이상을 목표로 하며 실제 시간은 진행 속도와 재시도에 따라 다르다.'],footer:['Steel Tide 0.8.14+ · 17 building types, 7 upgrades and 32 recruitable units; plus a deployed form and carrier drone · English / 中文 / 한국어.','Steel Tide 0.8.14+ · 17类建筑、7项升级及32种可生产单位，另有展开形态与舰载无人机 · English / 中文 / 한국어。','Steel Tide 0.8.14+ · 건물 17종, 업그레이드 7종, 생산 유닛 32종 및 별도 전개 형태와 함재 드론 · English / 中文 / 한국어.'],hp:['HP','生命','체력'],shield:['Shield','护盾','방벽'],metal:['Metal','金属','금속'],pop:['Pop','人口','인구'],power:['Power','电力','전력'],income:['Income / s','收入 / 秒','초당 수입'],upgrade:['Upgrade','升级','업그레이드'],weapons:['Weapon details','武器详情','무장 정보'],damage:['Damage','伤害','피해'],reload:['Reload','装填','재장전'],range:['Range','射程','사거리'],progress:['completed','已完成','완료'],seats:['seats','席位','좌석'],minutes:['min target','分钟（估计）','분 목표'],challenge:['Mastery','精通目标','숙련 목표']};
let lang=0,filter='all',checks={};try{lang=Number(localStorage.getItem('cyberpunk.lang')||0);checks=JSON.parse(localStorage.getItem('cyberpunk.mastery')||'{}')}catch{}if(![0,1,2].includes(lang))lang=0;
const $=id=>document.getElementById(id),w=k=>words[k][lang],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderCards(){const q=$('search').value.toLocaleLowerCase();const rows=data.mod.defs.filter(d=>(filter==='all'||filter==='building'&&d.kind==='building'||d.kind==='unit'&&(filter==='ground'?['ground','amphibious'].includes(d.domain):d.domain===filter))&&(d.name[lang]+' '+d.role[lang]).toLocaleLowerCase().includes(q));$('cards').innerHTML=rows.map(d=>`<article class="unit"><div class="unit-top"><img src="portraits/${esc(d.id)}.png" alt=""><div><h3>${esc(d.name[lang])}</h3><span class="eyebrow">${esc(d.kind==='building'?w('build'):w(d.domain==='amphibious'?'ground':d.domain))}</span></div></div><p>${esc(d.role[lang])}</p><div class="numbers"><span>${w('metal')} ${d.cost}</span><span>${w('hp')} ${d.hp}</span>${d.shield?`<span>${w('shield')} ${d.shield.hp}</span>`:''}<span>${w('power')} ${d.power||0}</span>${d.metalRate?`<span>${w('income')} ${d.metalRate}</span>`:''}${d.upgradeOf?`<span>${w('upgrade')} ${d.upgradeCost} · ${d.upgradeTime}s</span>`:''}${d.kind==='unit'?`<span>${w('pop')} ${d.pop}</span>`:''}</div>${d.weapons?.length?`<details><summary>${w('weapons')}</summary>${d.weapons.map(a=>`<div>${w('damage')} ${a.dmg}${a.burst?' × '+a.burst:''} · ${w('reload')} ${a.reload}s · ${w('range')} ${a.minRange||0}–${a.range}</div>`).join('')}</details>`:''}</article>`).join('')}
function progress(){const n=Object.values(checks).filter(Boolean).length;$('progress').textContent=`${n} / 24 ${w('progress')}`}
function render(){document.documentElement.lang=['en','zh','ko'][lang];$('language').value=lang;for(const [id,key]of Object.entries({'hero':'hero','s-build':'build','s-unit':'unit','s-map':'map','s-goals':'goals','n-start':'start','n-doctrine':'doctrine','n-roster':'roster','n-operations':'operations','start-title':'start','install-title':'installTitle','install':'install','preset':'preset','doctrine-title':'doctrine','network-title':'networkTitle','network':'network','counter-title':'counterTitle','counter':'counter','roster-title':'roster','op-title':'operations','op-note':'opNote','footer':'footer'}))$(id).textContent=w(key);$('premise').textContent=data.operations.premise[lang];$('search').placeholder=w('search');$('search').setAttribute('aria-label',w('search'));document.querySelectorAll('[data-filter]').forEach(b=>{b.textContent=w(b.dataset.filter==='building'?'build':b.dataset.filter);b.setAttribute('aria-pressed',b.dataset.filter===filter)});renderCards();$('ops').innerHTML=data.operations.operations.map((o,i)=>`<details class="operation" ${i===0?'open':''}><summary><span class="num">${String(i+1).padStart(2,'0')}</span><span><h3>${esc(o.names[lang].replace(/^\d+ · /,''))}</h3><span class="meta">${esc(o.focus[lang])} · ${o.seats} ${w('seats')} · ${o.minutes} ${w('minutes')}</span></span></summary><div class="op-body"><p>${esc(o.brief[lang])}</p><p>${esc(o.plan[lang])}</p><h3>${w('challenge')}</h3><div class="challenges">${o.challenges.map((c,j)=>`<label><input type="checkbox" data-check="${i}-${j}" ${checks[i+'-'+j]?'checked':''}><span>${esc(c[lang])}</span></label>`).join('')}</div></div></details>`).join('');document.querySelectorAll('[data-check]').forEach(c=>c.addEventListener('change',()=>{checks[c.dataset.check]=c.checked;try{localStorage.setItem('cyberpunk.mastery',JSON.stringify(checks))}catch{}progress()}));progress()}
$('language').addEventListener('change',e=>{lang=Number(e.target.value);try{localStorage.setItem('cyberpunk.lang',lang)}catch{}render()});$('search').addEventListener('input',renderCards);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));render();
</script></body></html>
